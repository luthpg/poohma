name: E2E (Staging)

on:
  workflow_call:
    inputs:
      base_url:
        required: false
        type: string
        default: ""
      convex_url:
        required: false
        type: string
        default: ""
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  resolve-playwright-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            pnpm-lock.yaml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - id: version
        run: |
          VERSION=$(yq -r '.importers["apps/web"].devDependencies["@playwright/test"].version' pnpm-lock.yaml)
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

  e2e:
    needs: resolve-playwright-version
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.resolve-playwright-version.outputs.version }}-noble
      options: --ipc=host
    env:
      E2E_BASE_URL: ${{ inputs.base_url != '' && inputs.base_url || vars.E2E_STAGING_URL }}
      VITE_CONVEX_URL: ${{ inputs.convex_url != '' && inputs.convex_url || vars.VITE_CONVEX_URL }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_PREVIEW_SERVICE_ACCOUNT }}
      VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_PREVIEW_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_PREVIEW_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PREVIEW_PROJECT_ID }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      E2E_FAMILY_PASSCODE: ${{ secrets.E2E_FAMILY_PASSCODE }}
      CONVEX_PREVIEW_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v3
        with:
          version: 12.14.0

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Wait for DNS and Edge propagation
        run: sleep 10

      - name: Run Full-Stack E2E Tests (Playwright)
        run: pnpm --filter @poohma/web run test:e2e

      - name: Upload Playwright Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            !apps/web/test-results/**/*.zip
          if-no-files-found: ignore
          retention-days: 7
