name: Deploy to Production

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy-convex-production:
    name: Deploy Convex Backend
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' && github.repository_owner == github.event.repository.owner.login }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          VITE_FIREBASE_API_KEY: "dummy_key"
          VITE_FIREBASE_AUTH_DOMAIN: "dummy.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "dummy"
          VITE_CONVEX_URL: "https://dummy.convex.cloud"

      - name: Deploy Convex Backend to Production
        run: pnpm --filter @poohma/backend run deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
