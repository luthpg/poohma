name: Release Extension

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "apps/extension/**"
      - "packages/shared/**"
      - ".github/workflows/release-extension.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: "${{ secrets.VITE_FIREBASE_PROJECT_ID }}.firebaseapp.com"
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
      VITE_SITE_URL: "https://poohma.ciderlabs.link"
      VITE_GITHUB_REPO_URL: "https://github.com/luthpg/poohma"

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck extension
        run: pnpm -F @poohma/extension typecheck

      - name: Check formatting and lint
        run: pnpm -F @poohma/extension check:ci

      - name: Build and Zip extension
        run: pnpm -F @poohma/extension zip

      - name: Verify bundle safety (Zero-Secrets Check)
        run: pnpm -F @poohma/extension verify:bundle

      - name: Determine artifact name
        id: artifact-meta
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "artifact_name=poohma-extension-pr${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            echo "artifact_name=poohma-extension-${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "artifact_name=poohma-extension-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload extension zip artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact-meta.outputs.artifact_name }}
          path: apps/extension/.output/*.zip
          if-no-files-found: error
          include-hidden-files: true

      - name: Generate summary for PR review
        if: github.event_name == 'pull_request'
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ### 🧩 Chrome 拡張機能 PR ビルド完了

          PR #${{ github.event.pull_request.number }} 用の拡張機能 zip が正常にビルドされました。

          - **アーティファクト名**: \`${{ steps.artifact-meta.outputs.artifact_name }}\`
          - **検証項目**: Typecheck, Lint (check:ci), Zip Build, Bundle Safety Check (Zero Secrets)
          - **テスト手順**:
            1. 本ワークフローの「Artifacts」から \`${{ steps.artifact-meta.outputs.artifact_name }}.zip\` をダウンロード
            2. ローカルで解凍
            3. Chrome の \`chrome://extensions\` で「パッケージ化されていない拡張機能を読み込む」から解凍フォルダを選択
          EOF

      - name: Attach zip to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if ! gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release create "${TAG_NAME}" apps/extension/.output/*.zip --title "${TAG_NAME}" --notes "Automated release for ${TAG_NAME}"
          else
            gh release upload "${TAG_NAME}" apps/extension/.output/*.zip --clobber
          fi
