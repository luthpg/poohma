name: Release Extension

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: "${{ secrets.VITE_FIREBASE_PROJECT_ID }}.firebaseapp.com"
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
      VITE_SITE_URL: "https://poohma.ciderlabs.link"
      VITE_GITHUB_REPO_URL: "https://github.com/luthpg/poohma"

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck extension
        run: pnpm -F @poohma/extension typecheck

      - name: Check formatting and lint
        run: pnpm -F @poohma/extension check:ci

      - name: Build and Zip extension
        run: pnpm -F @poohma/extension zip

      - name: Verify bundle safety (Zero-Secrets Check)
        run: pnpm -F @poohma/extension verify:bundle

      - name: Upload extension zip artifact
        uses: actions/upload-artifact@v7
        with:
          name: poohma-extension-${{ github.ref_name || github.sha }}
          path: apps/extension/.output/*.zip
          if-no-files-found: error

      - name: Attach zip to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if ! gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release create "${TAG_NAME}" apps/extension/.output/*.zip --title "${TAG_NAME}" --notes "Automated release for ${TAG_NAME}"
          else
            gh release upload "${TAG_NAME}" apps/extension/.output/*.zip --clobber
          fi
